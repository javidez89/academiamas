name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar mensajes del PR
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/check-commits.mjs "$BASE_SHA" "$HEAD_SHA"

  static-unit:
    name: Static and unit gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Validar sintaxis y versión
        run: npm run check

      - name: Validar línea base de migraciones
        run: npm run test:migration-baseline

      - name: Validar sesiones y tiempo de estudio verificables
        run: npm run test:verified-time

      - name: Validar respuestas y resultados verificables
        run: npm run test:verified-assessment

      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validar funciones de certificados, pagos y audio
        run: >-
          deno check --frozen --node-modules-dir=auto
          supabase/functions/certificate-service/index.ts
          supabase/functions/validate-certificate/index.ts
          supabase/functions/wompi-events/index.ts
          supabase/functions/course-audio/index.ts

      - name: Validar constancia PDF y anexo académico
        run: npm run test:certificate-pdf

      - name: Probar persistencia y estadísticas
        run: npm run test:unit

      - name: Audit course content and simulator realism
        run: npm run test:content

      - name: Regenerar manifiesto seguro de narraciones
        run: npm run generate:audio-manifest

      - name: Verificar narraciones para todos los cursos del catálogo
        run: git diff --exit-code -- supabase/functions/_shared/course-audio-manifest.ts

      - name: Regenerar SEO
        run: npm run generate:seo

      - name: Verificar artefactos SEO versionados
        run: >-
          git diff --exit-code --
          robots.txt sitemap.xml cursos ruta-aprendizaje contactanos legal validar-certificado mi-cuenta curso
          admin

  database-gates:
    name: Database security and analytics gates
    needs: static-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Iniciar PostgreSQL local de Supabase
        run: >-
          npx --yes supabase@2.116.0 start
          --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Validar permisos y exactitud de métricas
        run: npm run test:admin-analytics:db

      - name: Validar logros no regresivos y mensajería administrativa
        run: npm run test:progress-reliability:db

      - name: Impedir pérdida de historial y avance protegido
        run: npm run test:progress-integrity:db

      - name: Validar elegibilidad de evaluaciones en el servidor
        run: npm run test:assessment-eligibility:db

      - name: Ejecutar asesores de seguridad y rendimiento
        run: >-
          npx --yes supabase@2.116.0 db advisors --local
          --type all --level warn --fail-on error

  browser-gates:
    name: Browser integration gates
    needs: static-unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Regenerar SEO
        run: npm run generate:seo

      - name: Iniciar servidor estático
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 > /tmp/academiaqa-http.log 2>&1 &
          echo $! > /tmp/academiaqa-http.pid

      - name: Esperar disponibilidad
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/academiaqa-http.log
          exit 1

      - name: Validar todos los cursos
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:integration

      - name: Validar SEO y rutas
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:seo

      - name: Validar instalaciÃ³n PWA
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:pwa

      - name: Validar acceso con Google
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:auth

      - name: Validar matrícula y progreso en la nube
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:cloud

      - name: Validar recuperación de respuestas verificadas
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:progress-reliability:e2e

      - name: Validar reconexión, recarga y reintento único
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:progress-recovery:e2e

      - name: Validar claridad y actualización del progreso
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:progress-clarity:e2e

      - name: Validar narración local, avance y navegación
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:audio

      - name: Validar acceso y métricas administrativas
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:admin

      - name: Validar contacto, reseñas y bandeja
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:feedback

      - name: Validar gobernanza y preservación de historial
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:governance

      - name: Validar certificados, cuenta y administración
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:certificates

      - name: Validar ventajas de los cursos en el inicio
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:home-advantages

      - name: Validar flujo funcional crítico
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:e2e

      - name: Validar capítulos en escritorio y móvil
        env:
          ACADEMIAQA_URL: http://127.0.0.1:8080/
        run: npm run test:visual
